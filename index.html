
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Metadata -->
    <title>
      Parko | Smart Parking Reservations & Space Monetization
    </title>

    <meta
      name="description"
      content="Parko connects drivers with guaranteed parking spaces while helping property owners monetize unused parking spaces. Reserve parking easily and conveniently."
    />

    <meta name="robots" content="index, follow" />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/images/parko-icon.png"
    />

    <!-- Preload LCP Hero Image -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-parking.webp"
      fetchpriority="high"
    />

    <!-- Google Fonts Optimization -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>

  <body
    class="bg-surface-subtle text-navy-900 antialiased selection:bg-brand-500/20 selection:text-brand-900"
  >

    <!-- React Application Root -->
    <div id="root"></div>

    <!-- Application Entry Point -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
